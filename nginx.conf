server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind Traefik TLS: never emit absolute http:// Location (HTTPS→HTTP trap).
    absolute_redirect off;
    port_in_redirect off;

    # CMS slugs → rich static /dr-* profiles (both slash variants; nginx try_files
    # trailing-slash rewrite would otherwise skip Astro's redirect map).
    location ~ ^/practitioners/(dr-unnikrishnan|unnikrishnan)/?$ { return 301 /dr-unnikrishnan; }
    location ~ ^/practitioners/(dr-priyanka-bhuvanendran|dr-priyanka|priyanka)/?$ { return 301 /dr-priyanka; }
    location ~ ^/practitioners/(dr-gopika|dr-gopika-nair|gopika)/?$ { return 301 /dr-gopika; }

    # HTML must revalidate so deploys are visible; hashed assets stay cached.
    location / {
        try_files $uri $uri/ $uri.html /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
        access_log off;
    }
}
